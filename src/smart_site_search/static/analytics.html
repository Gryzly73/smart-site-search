<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Аналитика поиска</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/analytics.css">
</head>
<body>
  <a class="skip" href="#from">К периоду</a>
  <div class="frame analytics-page">
    <header>
      <div>
        <p class="eyebrow">Каталог Softline</p>
        <h1>Аналитика поиска</h1>
      </div>
      <nav>
        <a href="/">К поиску</a>
      </nav>
    </header>
    <form id="analytics-form" class="analytics-form panel">
      <div class="dates">
        <label>С
          <input id="from" name="from" type="date" required>
        </label>
        <label>До, не включительно
          <input id="to" name="to" type="date" required>
        </label>
      </div>
      <label>Данные
        <select id="cohort" name="cohort">
          <option value="all">Все, раздельно</option>
          <option value="real">Реальные действия демо</option>
          <option value="mock">Макет и синтетика</option>
        </select>
      </label>
      <label>Режим поиска
        <select id="mode" name="mode">
          <option value="all">Все режимы</option>
          <option value="direct">Прямой</option>
          <option value="functional">Функциональный</option>
          <option value="expert">Экспертный</option>
        </select>
      </label>
      <button type="submit">Применить</button>
    </form>
    <nav class="analytics-nav" aria-label="Разделы аналитики">
      <button type="button" data-view="overview" aria-controls="report" aria-pressed="true">Обзор</button>
      <button type="button" data-view="dialogues" aria-controls="report" aria-pressed="false">Диалоги</button>
      <button type="button" data-view="problems" aria-controls="report" aria-pressed="false">Проблемы</button>
    </nav>
    <p id="status" role="status">Отчёт появится после запроса к серверу. Если сервер недоступен, цифры не подставляются.</p>
    <main id="report" aria-label="Отчёт" tabindex="-1"></main>
  </div>
  <script type="module" src="/static/js/analytics.js?v=2"></script>
</body>
</html>
