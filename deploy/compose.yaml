services:
  search:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      SSS_CATALOG_PATH: /catalog/catalog.sqlite
      SSS_RUNTIME_PATH: /runtime/state.sqlite
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../data/catalog:/catalog:ro
      - search-runtime:/runtime
    restart: unless-stopped
volumes:
  search-runtime:
