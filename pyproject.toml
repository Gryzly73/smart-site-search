[project]
name = "smart-site-search"
version = "0.1.0"
description = "Хакатон: умный поиск на сайте"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "python-dotenv>=1,<2",
    "rapidfuzz>=3.9,<4",
    "uvicorn>=0.36,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smart_site_search = ["runtime_schema.sql", "static/*", "static/**/*", "taxonomy/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
